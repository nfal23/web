<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Page</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #3a4c7a, #d43643);
    }

    .card {
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 20px;
        width: 250px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: rgba(255,255,255,0.2);
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
        cursor: pointer;
    }

    .btn:hover {
        background: rgba(255,255,255,0.4);
    }

    /* QR Popup */
    .popup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        display: none;
        justify-content: center;
        align-items: center;
    }

    .popup-content {
        background: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
    }

    .popup img {
        width: 200px;
    }

    .close {
        margin-top: 10px;
        padding: 8px 15px;
        border: none;
        background: #333;
        color: white;
        border-radius: 5px;
        cursor: pointer;
    }

    .icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
    }
</style>
</head>

<body>

<div class="card">
    <a href="https://instagram.com/xixixi_656" target="_blank" class="btn">
        <img src="assets/ig.png" class="icon">
    Instagram
    </a>

    <a href="https://tiktok.com/@xixixixi_59" target="_blank" class="btn">
        <img src="assets/tt.png" class="icon">
    TikTok
    </a>

    <a href="https://www.roblox.com/users/7332871835/profile" target="_blank" class="btn">
    <img src="assets/rb.png" class="icon">
    Roblox
</a>

    <div class="btn" onclick="showQR()">
        ❤️ Support Me
    </div>
</div>

<!-- Popup QR -->
<div class="popup" id="qrPopup">
    <div class="popup-content">
        <h3>Support Me</h3>
            <!-- GANTI DENGAN QR KAMU -->
            <img src="assets/qr.jpeg" alt="QR Code">
        <br>
        <button class="close" onclick="closeQR()">Tutup</button>
    </div>
</div>

<script>
    function showQR() {
        document.getElementById("qrPopup").style.display = "flex";
    }

    function closeQR() {
        document.getElementById("qrPopup").style.display = "none";
    }
</script>

</body>
</html>
